
name: youtube-hdfs

services:
  namenode:
    image: apache/hadoop:3.4.2
    hostname: namenode
    command: ["hdfs", "namenode"]
    restart: unless-stopped

    ports:
      - "127.0.0.1:9870:9870"

    env_file:
      - ./hadoop.env

    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-hadoop/dfs/name

    volumes:
      - namenode_data:/tmp/hadoop-hadoop/dfs/name

    networks:
      - hdfs_network

  datanode:
    image: apache/hadoop:3.4.2
    hostname: datanode
    command: ["hdfs", "datanode"]
    restart: unless-stopped

    depends_on:
      - namenode

    env_file:
      - ./hadoop.env

    ports:
      - "127.0.0.1:9864:9864"

    volumes:
      - datanode_data:/tmp/hadoop-hadoop/dfs/data

    networks:
      - hdfs_network

networks:
  hdfs_network:
    driver: bridge

volumes:
  namenode_data:
  datanode_data:
